blueprint:
  name: TRV External Temperature Control
  description: >
    Synchronises an Aqara Smart Radiator Thermostat E1 with an external
    temperature sensor.

    Temperatures are rounded to one decimal place before comparison.
    The TRV is updated when the temperature difference meets or exceeds
    the configurable threshold.

    Updates are skipped when BOTH conditions are true:
    - TRV current temperature is above its target temperature.
    - External temperature is more than 0.2°C above the target temperature.

    A configurable minimum update interval is enforced. Temperature
    changes during this period are deferred and the latest temperature
    is used when the interval expires.

    Synchronisation can optionally be restricted to hvac_mode heat.

    Invalid, unavailable, or out-of-range external sensor values cause
    the TRV to fall back to its internal temperature.

    Failed temperature updates are retried at a configurable interval.
    External temperature mode is verified before every update attempt.

    Requires one input_datetime helper per TRV to record the last
    successfully confirmed temperature update.

  domain: automation

  source_url: https://github.com/mattabc-lab/blueprint/blob/main/trv_external_temperature_control.yml

  input:
    external_temp_sensor:
      name: External Temperature Sensor
      description: Temperature sensor used as the external temperature source.
      selector:
        entity:
          filter:
            domain: sensor
            device_class:
              - temperature

    aqara_trv_device:
      name: Aqara TRV Device
      description: Select the Aqara Smart Radiator Thermostat E1.
      selector:
        device:
          multiple: false
          filter:
            - integration: mqtt
              manufacturer: Aqara
              model: Smart radiator thermostat E1 (SRTS-A01)
            - integration: mqtt
              manufacturer: Aqara
              model: Smart radiator thermostat E1
            - integration: mqtt
              manufacturer: Aqara
              model: Aqara Smart Radiator thermostat E1 (SRTS-A01)
            - integration: mqtt
              manufacturer: Aqara
              model: Aqara smart radiator thermostat E1 (SRTS-A01)

    sync_only_when_heat:
      name: Sync Only When TRV Is in Heat Mode
      description: Only synchronise when the TRV climate entity is in heat mode.
      default: true
      selector:
        boolean:

    external_temperature_input_name:
      name: TRV External Temperature Entity Name
      description: Keyword identifying the TRV number entity accepting external temperature.
      default: external
      selector:
        text:

    last_update_helper:
      name: Last Successful TRV Update
      description: input_datetime helper configured with both date and time.
      selector:
        entity:
          filter:
            - domain: input_datetime

    temperature_change_threshold:
      name: Temperature Change Threshold
      description: Minimum temperature difference required before updating the TRV.
      default: 0.1
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

    minimum_valid_temperature:
      name: Minimum Valid External Temperature
      description: External readings below this value are invalid.
      default: 1
      selector:
        number:
          min: -20
          max: 20
          step: 1
          unit_of_measurement: "°C"
          mode: box

    maximum_valid_temperature:
      name: Maximum Valid External Temperature
      description: External readings above this value are invalid.
      default: 35
      selector:
        number:
          min: 20
          max: 60
          step: 1
          unit_of_measurement: "°C"
          mode: box

    minimum_update_interval:
      name: Minimum Update Interval
      description: Minimum time between successful temperature updates.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: minutes
          mode: box

    retry_interval:
      name: Failed Update Retry Interval
      description: Time to wait before retrying an unconfirmed update.
      default: 5
      selector:
        number:
          min: 2
          max: 30
          step: 1
          unit_of_measurement: minutes
          mode: box

    max_retries:
      name: Maximum Failed Update Retries
      description: Maximum retries after the initial attempt.
      default: 1
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: box

    force_update_interval:
      name: Force Update Interval
      description: Periodically resend the current temperature even when unchanged.
      default: 60
      selector:
        number:
          min: 15
          max: 180
          step: 5
          unit_of_measurement: minutes
          mode: box

    confirmation_timeout:
      name: TRV Confirmation Timeout
      description: Maximum time to wait for the TRV to reflect the requested temperature.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: seconds
          mode: box

    external_mode_timeout:
      name: External Mode Confirmation Timeout
      description: Maximum time to wait for external temperature mode confirmation.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: seconds
          mode: box

mode: single
max_exceeded: silent

variables:
  aqara_trv_device: !input aqara_trv_device
  external_temp_sensor: !input external_temp_sensor
  external_temperature_input_name: !input external_temperature_input_name
  last_update_helper: !input last_update_helper
  sync_only_when_heat: !input sync_only_when_heat
  temperature_change_threshold: !input temperature_change_threshold
  minimum_valid_temperature: !input minimum_valid_temperature
  maximum_valid_temperature: !input maximum_valid_temperature
  minimum_update_interval: !input minimum_update_interval
  retry_interval: !input retry_interval
  max_retries: !input max_retries
  force_update_interval: !input force_update_interval
  confirmation_timeout: !input confirmation_timeout
  external_mode_timeout: !input external_mode_timeout

trigger:
  - trigger: state
    entity_id: !input external_temp_sensor
    id: temperature_change

  - trigger: time_pattern
    minutes: "/5"
    id: periodic_check

  - trigger: homeassistant
    event: start
    id: home_assistant_start

action:
  # Locate entities belonging to the selected TRV.
  - variables:
      aqara_trv_device_name: >-
        {{ device_attr(aqara_trv_device, 'name') }}

      aqara_trv_climate_entity: >-
        {% set ids = device_entities(aqara_trv_device) %}
        {{ expand(states['climate'])
          | selectattr('entity_id', 'in', ids)
          | map(attribute='entity_id')
          | first }}

      aqara_trv_select_entity: >-
        {% set ids = device_entities(aqara_trv_device) %}
        {{ expand(states['select'])
          | selectattr('entity_id', 'in', ids)
          | selectattr('attributes.options', 'contains', 'external')
          | map(attribute='entity_id')
          | first }}

      aqara_trv_number_entity: >-
        {% set ids = device_entities(aqara_trv_device) %}
        {{ expand(states['number'])
          | selectattr('entity_id', 'in', ids)
          | selectattr('entity_id', 'contains', external_temperature_input_name)
          | map(attribute='entity_id')
          | first }}

  # Validate external sensor.
  - variables:
      external_sensor_state: "{{ states(external_temp_sensor) }}"
      external_sensor_valid: >-
        {{
          has_value(external_temp_sensor)
          and is_number(states(external_temp_sensor))
          and (states(external_temp_sensor) | float) >= (minimum_valid_temperature | float)
          and (states(external_temp_sensor) | float) <= (maximum_valid_temperature | float)
        }}

  # Invalid sensor: fall back to internal temperature.
  - if:
      - condition: template
        value_template: "{{ not external_sensor_valid }}"
    then:
      - if:
          - condition: template
            value_template: "{{ has_value(aqara_trv_select_entity) }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ aqara_trv_select_entity }}"
            data:
              option: internal

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'temperature_change' }}"
        then:
          - action: system_log.write
            data:
              level: warning
              message: >
                External temperature sensor is unavailable or invalid for
                {{ aqara_trv_device_name }}. Value: {{ external_sensor_state }}.
                TRV switched to internal temperature.
              logger: Aqara TRV

      - stop: External temperature sensor unavailable or invalid

  # Check heating mode.
  - if:
      - condition: template
        value_template: >-
          {{
            sync_only_when_heat
            and (
              not has_value(aqara_trv_climate_entity)
              or not is_state(aqara_trv_climate_entity, 'heat')
            )
          }}
    then:
      - stop: TRV is not in heat mode

  # Check TRV entity availability.
  - if:
      - condition: template
        value_template: >-
          {{
            not has_value(aqara_trv_number_entity)
            or not has_value(aqara_trv_select_entity)
          }}
    then:
      - wait_template: >-
          {{
            has_value(aqara_trv_number_entity)
            and has_value(aqara_trv_select_entity)
          }}
        timeout:
          seconds: 30
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: >-
              {{
                not has_value(aqara_trv_number_entity)
                or not has_value(aqara_trv_select_entity)
              }}
        then:
          - stop: TRV unavailable

  # Read temperatures and last update time.
  - variables:
      current_temperature: >-
        {{ states(external_temp_sensor) | float | round(1) }}

      trv_temperature: >-
        {{ states(aqara_trv_number_entity) | float | round(1) }}

      trv_target_temperature: >-
        {{ state_attr(aqara_trv_climate_entity, 'temperature') | float(0) }}

      temperature_difference: >-
        {{
          (
            (states(external_temp_sensor) | float | round(1))
            -
            (states(aqara_trv_number_entity) | float | round(1))
          ) | abs
        }}

      minutes_since_last_update: >-
        {{
          (
            as_timestamp(now())
            - as_timestamp(states(last_update_helper), default=0)
          ) / 60
        }}

  # Skip only when BOTH conditions are true.
  - if:
      - condition: template
        value_template: >-
          {{
            trv_temperature > trv_target_temperature
            and
            current_temperature > (trv_target_temperature + 0.2)
          }}
    then:
      - stop: TRV is above target and external temperature exceeds target by more than 0.2°C

  # Determine whether an update is required.
  - variables:
      update_required: >-
        {{
          temperature_difference >= (temperature_change_threshold | float)
          or minutes_since_last_update >= (force_update_interval | float)
          or trigger.id == 'home_assistant_start'
          or not is_state(aqara_trv_select_entity, 'external')
        }}

  - if:
      - condition: template
        value_template: "{{ not update_required }}"
    then:
      - stop: No update required

  # Enforce minimum update interval.
  - if:
      - condition: template
        value_template: >-
          {{ minutes_since_last_update < (minimum_update_interval | float) }}
    then:
      - delay:
          seconds: >-
            {{
              (
                (minimum_update_interval | float * 60)
                - (
                    as_timestamp(now())
                    - as_timestamp(states(last_update_helper), default=0)
                  )
              ) | max(0) | round(0)
            }}

  # Re-read the latest states after waiting.
  - variables:
      external_sensor_state: "{{ states(external_temp_sensor) }}"

      external_sensor_valid: >-
        {{
          has_value(external_temp_sensor)
          and is_number(states(external_temp_sensor))
          and (states(external_temp_sensor) | float) >= (minimum_valid_temperature | float)
          and (states(external_temp_sensor) | float) <= (maximum_valid_temperature | float)
        }}

      current_temperature: >-
        {{ states(external_temp_sensor) | float | round(1) }}

      trv_temperature: >-
        {{ states(aqara_trv_number_entity) | float | round(1) }}

      trv_target_temperature: >-
        {{ state_attr(aqara_trv_climate_entity, 'temperature') | float(0) }}

      temperature_difference: >-
        {{
          (
            (states(external_temp_sensor) | float | round(1))
            -
            (states(aqara_trv_number_entity) | float | round(1))
          ) | abs
        }}

      minutes_since_last_update: >-
        {{
          (
            as_timestamp(now())
            - as_timestamp(states(last_update_helper), default=0)
          ) / 60
        }}

  # Sensor may have become unavailable during the delay.
  - if:
      - condition: template
        value_template: "{{ not external_sensor_valid }}"
    then:
      - action: select.select_option
        target:
          entity_id: "{{ aqara_trv_select_entity }}"
        data:
          option: internal

      - action: system_log.write
        data:
          level: warning
          message: >
            External temperature sensor became invalid while waiting to update
            {{ aqara_trv_device_name }}. Value: {{ external_sensor_state }}.
            TRV switched to internal temperature.
          logger: Aqara TRV

      - stop: External temperature sensor became invalid

  # Re-check heating mode after waiting.
  - if:
      - condition: template
        value_template: >-
          {{
            sync_only_when_heat
            and (
              not has_value(aqara_trv_climate_entity)
              or not is_state(aqara_trv_climate_entity, 'heat')
            )
          }}
    then:
      - stop: TRV left heat mode while waiting

  # Re-check the two temperature conditions after waiting.
  - if:
      - condition: template
        value_template: >-
          {{
            trv_temperature > trv_target_temperature
            and
            current_temperature > (trv_target_temperature + 0.2)
          }}
    then:
      - stop: TRV is above target and external temperature exceeds target by more than 0.2°C

  # Re-evaluate whether an update is still required.
  - if:
      - condition: template
        value_template: >-
          {{
            temperature_difference < (temperature_change_threshold | float)
            and minutes_since_last_update < (force_update_interval | float)
            and trigger.id != 'home_assistant_start'
            and is_state(aqara_trv_select_entity, 'external')
          }}
    then:
      - stop: Temperature difference no longer requires update

  # Ensure external temperature mode.
  - if:
      - condition: template
        value_template: "{{ not is_state(aqara_trv_select_entity, 'external') }}"
    then:
      - action: select.select_option
        target:
          entity_id: "{{ aqara_trv_select_entity }}"
        data:
          option: external

      - wait_template: "{{ is_state(aqara_trv_select_entity, 'external') }}"
        timeout:
          seconds: "{{ external_mode_timeout | int }}"
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: system_log.write
            data:
              level: warning
              message: >
                Failed to switch {{ aqara_trv_device_name }}
                to external temperature mode.
              logger: Aqara TRV

          - stop: Failed to select external mode

  # Initial update plus configured retries.
  - repeat:
      count: "{{ (max_retries | int) + 1 }}"
      sequence:
        # Check TRV availability.
        - if:
            - condition: template
              value_template: >-
                {{
                  not has_value(aqara_trv_number_entity)
                  or not has_value(aqara_trv_select_entity)
                }}
          then:
            - stop: TRV became unavailable

        # Check heating mode before every attempt.
        - if:
            - condition: template
              value_template: >-
                {{
                  sync_only_when_heat
                  and (
                    not has_value(aqara_trv_climate_entity)
                    or not is_state(aqara_trv_climate_entity, 'heat')
                  )
                }}
          then:
            - stop: TRV is no longer in heat mode

        # Validate sensor before every attempt.
        - variables:
            external_sensor_state: "{{ states(external_temp_sensor) }}"
            external_sensor_valid: >-
              {{
                has_value(external_temp_sensor)
                and is_number(states(external_temp_sensor))
                and (states(external_temp_sensor) | float) >= (minimum_valid_temperature | float)
                and (states(external_temp_sensor) | float) <= (maximum_valid_temperature | float)
              }}

        - if:
            - condition: template
              value_template: "{{ not external_sensor_valid }}"
          then:
            - action: select.select_option
              target:
                entity_id: "{{ aqara_trv_select_entity }}"
              data:
                option: internal

            - action: system_log.write
              data:
                level: warning
                message: >
                  External temperature became invalid for {{ aqara_trv_device_name }}
                  during update attempt. Value: {{ external_sensor_state }}.
                  TRV switched to internal temperature.
              logger: Aqara TRV

            - stop: External temperature sensor became invalid

        # Restore external mode before every attempt.
        - if:
            - condition: template
              value_template: "{{ not is_state(aqara_trv_select_entity, 'external') }}"
          then:
            - action: select.select_option
              target:
                entity_id: "{{ aqara_trv_select_entity }}"
              data:
                option: external

            - wait_template: "{{ is_state(aqara_trv_select_entity, 'external') }}"
              timeout:
                seconds: "{{ external_mode_timeout | int }}"
              continue_on_timeout: true

            - if:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              then:
                - action: system_log.write
                  data:
                    level: warning
                    message: >
                      Failed to restore external temperature mode for
                      {{ aqara_trv_device_name }} before update attempt.
                    logger: Aqara TRV

                - stop: Failed to restore external mode

        # Refresh all temperatures immediately before the update.
        - variables:
            current_temperature: >-
              {{ states(external_temp_sensor) | float | round(1) }}

            trv_temperature: >-
              {{ states(aqara_trv_number_entity) | float | round(1) }}

            trv_target_temperature: >-
              {{ state_attr(aqara_trv_climate_entity, 'temperature') | float(0) }}

        # Skip this attempt only when BOTH conditions are true.
        - if:
            - condition: template
              value_template: >-
                {{
                  trv_temperature > trv_target_temperature
                  and
                  current_temperature > (trv_target_temperature + 0.2)
                }}
          then:
            - stop: TRV is above target and external temperature exceeds target by more than 0.2°C

        # Send temperature to the TRV.
        - action: number.set_value
          target:
            entity_id: "{{ aqara_trv_number_entity }}"
          data:
            value: "{{ current_temperature }}"

        # Wait for TRV confirmation.
        - wait_template: >-
            {{
              has_value(aqara_trv_number_entity)
              and (
                states(aqara_trv_number_entity) | float(999) | round(1)
              ) == (
                current_temperature | float(999) | round(1)
              )
            }}
          timeout:
            seconds: "{{ confirmation_timeout | int }}"
          continue_on_timeout: true

        # Success: record only confirmed updates.
        - if:
            - condition: template
              value_template: "{{ wait.completed }}"
          then:
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ last_update_helper }}"
              data:
                timestamp: "{{ now().timestamp() }}"

            - stop: TRV temperature update confirmed

        # Failed attempt: retry if configured.
        - if:
            - condition: template
              value_template: "{{ repeat.index <= (max_retries | int) }}"
          then:
            - action: system_log.write
              data:
                level: warning
                message: >
                  Aqara TRV {{ aqara_trv_device_name }} did not confirm temperature
