blueprint:
  name: TRV External Temperature Control
  description: >
    Synchronises a Smart Radiator Thermostat with an external
    Home Assistant temperature sensor.

    The automation validates the external sensor and TRV entities, supports
    bidirectional temperature differences, enforces a minimum update interval,
    verifies external/internal mode changes, and retries unconfirmed updates.
    It records the time of the last confirmed synchronisation.

    Sensor freshness is based on Home Assistant's last_updated timestamp.
    Sensors that only update when their value changes may need a longer
    maximum sensor age.

    Requires one input_datetime helper per TRV, configured with both date
    and time.
  domain: automation

  input:
    external_temp_sensor:
      name: External Temperature Sensor
      description: Temperature sensor used as the external temperature source.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature

    aqara_trv_device:
      name: TRV Device
      description: Select the Smart Radiator Thermostat.
      selector:
        device:
          multiple: false
          filter:
            - integration: mqtt
              manufacturer: Aqara
              model: Smart radiator thermostat E1 (SRTS-A01)
            - integration: mqtt
              manufacturer: Aqara
              model: Smart radiator thermostat E1
            - integration: mqtt
              manufacturer: Aqara
              model: Aqara Smart Radiator thermostat E1 (SRTS-A01)
            - integration: mqtt
              manufacturer: Aqara
              model: Aqara smart radiator thermostat E1 (SRTS-A01)

    sync_only_when_heat:
      name: Sync Only When TRV Is in Heat Mode
      description: Only synchronise when the climate entity is in heat mode.
      default: true
      selector:
        boolean:

    external_temperature_input_name:
      name: TRV External Temperature Entity Name
      description: Keyword in the number entity ID that accepts external temperature.
      default: external
      selector:
        text:

    last_update_helper:
      name: Last Successful TRV Update
      description: input_datetime helper configured with both date and time.
      selector:
        entity:
          filter:
            domain: input_datetime

    temperature_change_threshold:
      name: Temperature Change Threshold
      description: Minimum absolute difference required before updating the TRV.
      default: 0.2
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

    minimum_valid_temperature:
      name: Minimum Valid External Temperature
      description: External readings below this value are invalid.
      default: 1
      selector:
        number:
          min: 0
          max: 20
          step: 1
          unit_of_measurement: "°C"
          mode: box

    maximum_valid_temperature:
      name: Maximum Valid External Temperature
      description: External readings above this value are invalid.
      default: 35
      selector:
        number:
          min: 20
          max: 55
          step: 1
          unit_of_measurement: "°C"
          mode: box

    maximum_sensor_age:
      name: Maximum External Sensor Age
      description: >
        Maximum age in minutes of the sensor's last state change.
        Set to 0 to disable this check. Increase this for sensors that report
        only when their temperature changes.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          step: 5
          unit_of_measurement: minutes
          mode: box

    temperature_target_tolerance:
      name: Heating Protection Target Tolerance
      description: >
        Do not update when the TRV is above target and the external
        temperature is above target by more than this tolerance.
      default: 0.2
      selector:
        number:
          min: 0
          max: 1
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

    minimum_update_interval:
      name: Minimum Update Interval
      description: Minimum time between successfully confirmed updates.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: minutes
          mode: box

    retry_interval:
      name: Failed Update Retry Interval
      description: Time to wait before retrying an unconfirmed update.
      default: 2
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: minutes
          mode: box

    max_retries:
      name: Maximum Failed Update Retries
      description: Number of retries after the initial attempt.
      default: 2
      selector:
        number:
          min: 0
          max: 5
          step: 1
          mode: box

    force_update_interval:
      name: Force Update Interval
      description: Periodically resend the temperature even when unchanged.
      default: 30
      selector:
        number:
          min: 15
          max: 180
          step: 5
          unit_of_measurement: minutes
          mode: box

    confirmation_timeout:
      name: TRV Confirmation Timeout
      description: Maximum time to wait for the external input and climate temperature to reflect the requested value and the selected temperature mode to change.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: seconds
          mode: box

mode: single
max_exceeded: silent

variables:
  aqara_trv_device: !input aqara_trv_device
  external_temp_sensor: !input external_temp_sensor
  external_temperature_input_name: !input external_temperature_input_name
  last_update_helper: !input last_update_helper
  sync_only_when_heat: !input sync_only_when_heat
  temperature_change_threshold: !input temperature_change_threshold
  minimum_valid_temperature: !input minimum_valid_temperature
  maximum_valid_temperature: !input maximum_valid_temperature
  maximum_sensor_age: !input maximum_sensor_age
  temperature_target_tolerance: !input temperature_target_tolerance
  minimum_update_interval: !input minimum_update_interval
  retry_interval: !input retry_interval
  max_retries: !input max_retries
  force_update_interval: !input force_update_interval
  confirmation_timeout: !input confirmation_timeout

trigger:
  - trigger: state
    entity_id: !input external_temp_sensor
    id: temperature_change

  - trigger: time_pattern
    minutes: "/5"
    id: periodic_check

  - trigger: homeassistant
    event: start
    id: home_assistant_start

action:
  # Discover the entities associated with the selected Aqara device.
  - variables:
      aqara_trv_device_name: "{{ device_attr(aqara_trv_device, 'name') }}"
      aqara_trv_climate_entity: >-
        {{ device_entities(aqara_trv_device)
           | select('match', '^climate\.')
           | list | first | default('') }}
      aqara_trv_select_entity: >-
        {% set ids = device_entities(aqara_trv_device) %}
        {{ expand(ids)
           | selectattr('entity_id', 'match', '^select\.')
           | selectattr('attributes.options', 'contains', 'external')
           | map(attribute='entity_id')
           | list | first | default('') }}
      aqara_trv_number_entity: >-
        {% set ids = device_entities(aqara_trv_device) %}
        {{ ids
           | select('match', '^number\.')
           | select('search', external_temperature_input_name)
           | list | first | default('') }}

  # Wait briefly for entities to become available during Home Assistant startup.
  - if:
      - condition: template
        value_template: >-
          {{
            aqara_trv_climate_entity == ''
            or aqara_trv_select_entity == ''
            or aqara_trv_number_entity == ''
          }}
    then:
      - action: system_log.write
        data:
          level: error
          logger: TRV Sync
          message: >
            Could not discover all required entities for {{ aqara_trv_device_name }}.
            Climate={{ aqara_trv_climate_entity }},
            select={{ aqara_trv_select_entity }},
            number={{ aqara_trv_number_entity }}.
      - stop: Required TRV entities could not be discovered

  - wait_template: >-
      {{
        has_value(aqara_trv_climate_entity)
        and has_value(aqara_trv_select_entity)
        and has_value(aqara_trv_number_entity)
      }}
    timeout:
      seconds: 30
    continue_on_timeout: true

  - if:
      - condition: template
        value_template: >-
          {{
            not has_value(aqara_trv_climate_entity)
            or not has_value(aqara_trv_select_entity)
            or not has_value(aqara_trv_number_entity)
          }}
    then:
      - action: system_log.write
        data:
          level: error
          logger: TRV Sync
          message: >
            Required TRV entity unavailable for {{ aqara_trv_device_name }}.
            Climate={{ aqara_trv_climate_entity }},
            select={{ aqara_trv_select_entity }},
            number={{ aqara_trv_number_entity }}.
      - stop: Required TRV entity unavailable

  # Read and validate the external sensor.
  - variables:
      external_sensor_state: "{{ states(external_temp_sensor) }}"
      external_sensor_valid: >-
        {% set value = states(external_temp_sensor) %}
        {% set age = (
          as_timestamp(now())
          - as_timestamp(states[external_temp_sensor].last_updated)
        ) / 60 %}
        {{
          has_value(external_temp_sensor)
          and is_number(value)
          and (value | float) >= (minimum_valid_temperature | float)
          and (value | float) <= (maximum_valid_temperature | float)
          and (
            (maximum_sensor_age | float) == 0
            or age <= (maximum_sensor_age | float)
          )
        }}

  # Invalid/stale sensor: return the TRV to internal temperature mode.
  - if:
      - condition: template
        value_template: "{{ not external_sensor_valid }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not is_state(aqara_trv_select_entity, 'internal') }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ aqara_trv_select_entity }}"
            data:
              option: internal

          - wait_template: "{{ is_state(aqara_trv_select_entity, 'internal') }}"
            timeout:
              seconds: "{{ confirmation_timeout | int }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - action: system_log.write
                data:
                  level: error
                  logger: TRV Sync
                  message: >
                    Failed to confirm internal temperature mode for
                    {{ aqara_trv_device_name }}.

      - if:
          - condition: template
            value_template: "{{ trigger.id != 'periodic_check' }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: TRV Sync
              message: >
                External sensor invalid or stale for {{ aqara_trv_device_name }}.
                Value={{ external_sensor_state }}.
                TRV requested to use internal temperature.
      - stop: External temperature sensor unavailable, invalid or stale

  # Check the requested HVAC mode.
  - if:
      - condition: template
        value_template: >-
          {{
            sync_only_when_heat
            and not is_state(aqara_trv_climate_entity, 'heat')
          }}
    then:
      - stop: TRV is not in heat mode

  # Validate climate current and target temperatures before calculations.
  - variables:
      trv_current_raw: "{{ state_attr(aqara_trv_climate_entity, 'current_temperature') }}"
      trv_target_raw: "{{ state_attr(aqara_trv_climate_entity, 'temperature') }}"

  - if:
      - condition: template
        value_template: >-
          {{
            not is_number(trv_current_raw)
            or not is_number(trv_target_raw)
          }}
    then:
      - action: system_log.write
        data:
          level: warning
          logger: TRV Sync
          message: >
            Invalid TRV temperature attributes for {{ aqara_trv_device_name }}.
            Current={{ trv_current_raw }}, target={{ trv_target_raw }}.
      - stop: TRV current or target temperature is invalid

  # Calculate the initial update decision.
  - variables:
      current_temperature: "{{ states(external_temp_sensor) | float | round(1) }}"
      trv_temperature: "{{ trv_current_raw | float | round(1) }}"
      trv_target_temperature: "{{ trv_target_raw | float }}"
      temperature_difference: >-
        {{
          (
            (states(external_temp_sensor) | float | round(1))
            - (trv_current_raw | float | round(1))
          ) | abs
        }}
      last_update_timestamp: >-
        {{ as_timestamp(states(last_update_helper), default=0) | float(0) }}
      minutes_since_last_update: >-
        {% set ts = as_timestamp(states(last_update_helper), default=0) | float(0) %}
        {% if ts <= 0 %}
          999999
        {% else %}
          {{ (as_timestamp(now()) - ts) / 60 }}
        {% endif %}

  # Preserve the original two-part heating protection rule.
  - if:
      - condition: template
        value_template: >-
          {{
            trv_temperature > trv_target_temperature
            and
            current_temperature >
              (trv_target_temperature + (temperature_target_tolerance | float))
          }}
    then:
      - stop: TRV is above target and external temperature exceeds target tolerance

  # Decide whether a sync is required.
  - variables:
      update_required: >-
        {{
          (temperature_difference | float) >= (temperature_change_threshold | float)
          or (minutes_since_last_update | float) >= (force_update_interval | float)
          or trigger.id == 'home_assistant_start'
          or not is_state(aqara_trv_select_entity, 'external')
        }}

  - if:
      - condition: template
        value_template: "{{ not update_required }}"
    then:
      - stop: No update required

  # Enforce the minimum interval after a previously confirmed update.
  - if:
      - condition: template
        value_template: >-
          {{
            (minutes_since_last_update | float) < (minimum_update_interval | float)
          }}
    then:
      - delay:
          seconds: >-
            {{
              (
                (minimum_update_interval | float * 60)
                - (
                    as_timestamp(now())
                    - (last_update_timestamp | float)
                  )
              ) | max(0) | round(0)
            }}

  # Re-read and revalidate after waiting; never use the old sensor value.
  - variables:
      external_sensor_state: "{{ states(external_temp_sensor) }}"
      external_sensor_valid: >-
        {% set value = states(external_temp_sensor) %}
        {% set age = (
          as_timestamp(now())
          - as_timestamp(states[external_temp_sensor].last_updated)
        ) / 60 %}
        {{
          has_value(external_temp_sensor)
          and is_number(value)
          and (value | float) >= (minimum_valid_temperature | float)
          and (value | float) <= (maximum_valid_temperature | float)
          and (
            (maximum_sensor_age | float) == 0
            or age <= (maximum_sensor_age | float)
          )
        }}
      current_temperature: "{{ states(external_temp_sensor) | float(0) | round(1) }}"
      trv_current_raw: "{{ state_attr(aqara_trv_climate_entity, 'current_temperature') }}"
      trv_target_raw: "{{ state_attr(aqara_trv_climate_entity, 'temperature') }}"
      last_update_timestamp: >-
        {{ as_timestamp(states(last_update_helper), default=0) | float(0) }}
      minutes_since_last_update: >-
        {% set ts = as_timestamp(states(last_update_helper), default=0) | float(0) %}
        {% if ts <= 0 %}
          999999
        {% else %}
          {{ (as_timestamp(now()) - ts) / 60 }}
        {% endif %}

  - if:
      - condition: template
        value_template: "{{ not external_sensor_valid }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not is_state(aqara_trv_select_entity, 'internal') }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ aqara_trv_select_entity }}"
            data:
              option: internal
          - wait_template: "{{ is_state(aqara_trv_select_entity, 'internal') }}"
            timeout:
              seconds: "{{ confirmation_timeout | int }}"
            continue_on_timeout: true
      - action: system_log.write
        data:
          level: warning
          logger: TRV Sync
          message: >
            External sensor became invalid or stale while waiting for
            {{ aqara_trv_device_name }}. Value={{ external_sensor_state }}.
            Internal mode requested.
      - stop: External sensor became invalid while waiting

  - if:
      - condition: template
        value_template: >-
          {{
            not is_number(trv_current_raw)
            or not is_number(trv_target_raw)
          }}
    then:
      - stop: TRV temperature became invalid while waiting

  - variables:
      trv_temperature: "{{ trv_current_raw | float | round(1) }}"
      trv_target_temperature: "{{ trv_target_raw | float }}"
      temperature_difference: >-
        {{
          (
            (current_temperature | float)
            - (trv_current_raw | float | round(1))
          ) | abs
        }}

  - if:
      - condition: template
        value_template: >-
          {{
            sync_only_when_heat
            and not is_state(aqara_trv_climate_entity, 'heat')
          }}
    then:
      - stop: TRV left heat mode while waiting

  - if:
      - condition: template
        value_template: >-
          {{
            trv_temperature > trv_target_temperature
            and
            (current_temperature | float) >
              (trv_target_temperature + (temperature_target_tolerance | float))
          }}
    then:
      - stop: Heating protection condition became true while waiting

  - if:
      - condition: template
        value_template: >-
          {{
            (temperature_difference | float) < (temperature_change_threshold | float)
            and (minutes_since_last_update | float) < (force_update_interval | float)
            and trigger.id != 'home_assistant_start'
            and is_state(aqara_trv_select_entity, 'external')
          }}
    then:
      - stop: Temperature difference no longer requires update

  # Switch to external mode and verify it before sending the temperature.
  - if:
      - condition: template
        value_template: "{{ not is_state(aqara_trv_select_entity, 'external') }}"
    then:
      - action: select.select_option
        target:
          entity_id: "{{ aqara_trv_select_entity }}"
        data:
          option: external

      - wait_template: "{{ is_state(aqara_trv_select_entity, 'external') }}"
        timeout:
          seconds: "{{ confirmation_timeout | int }}"
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: system_log.write
            data:
              level: error
              logger: TRV Sync
              message: >
                Failed to confirm external temperature mode for
                {{ aqara_trv_device_name }}.
          - stop: Failed to select external mode

  # Initial attempt plus configured retries.
  - repeat:
      count: "{{ (max_retries | int) + 1 }}"
      sequence:
        # Revalidate sensor, TRV availability, mode and temperatures every attempt.
        - if:
            - condition: template
              value_template: >-
                {{
                  not has_value(aqara_trv_climate_entity)
                  or not has_value(aqara_trv_select_entity)
                  or not has_value(aqara_trv_number_entity)
                }}
          then:
            - stop: TRV entity became unavailable

        - if:
            - condition: template
              value_template: >-
                {{
                  sync_only_when_heat
                  and not is_state(aqara_trv_climate_entity, 'heat')
                }}
          then:
            - stop: TRV is no longer in heat mode

        - variables:
            external_sensor_state: "{{ states(external_temp_sensor) }}"
            external_sensor_valid: >-
              {% set value = states(external_temp_sensor) %}
              {% set age = (
                as_timestamp(now())
                - as_timestamp(states[external_temp_sensor].last_updated)
              ) / 60 %}
              {{
                has_value(external_temp_sensor)
                and is_number(value)
                and (value | float) >= (minimum_valid_temperature | float)
                and (value | float) <= (maximum_valid_temperature | float)
                and (
                  (maximum_sensor_age | float) == 0
                  or age <= (maximum_sensor_age | float)
                )
              }}
            current_temperature: "{{ states(external_temp_sensor) | float(0) | round(1) }}"
            trv_current_raw: "{{ state_attr(aqara_trv_climate_entity, 'current_temperature') }}"
            trv_target_raw: "{{ state_attr(aqara_trv_climate_entity, 'temperature') }}"

        - if:
            - condition: template
              value_template: "{{ not external_sensor_valid }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ not is_state(aqara_trv_select_entity, 'internal') }}"
              then:
                - action: select.select_option
                  target:
                    entity_id: "{{ aqara_trv_select_entity }}"
                  data:
                    option: internal
                - wait_template: "{{ is_state(aqara_trv_select_entity, 'internal') }}"
                  timeout:
                    seconds: "{{ confirmation_timeout | int }}"
                  continue_on_timeout: true
            - action: system_log.write
              data:
                level: warning
                logger: TRV Sync
                message: >
                  External sensor invalid or stale during update attempt for
                  {{ aqara_trv_device_name }}. Value={{ external_sensor_state }}.
                  Internal mode requested.
            - stop: External sensor became invalid during update

        - if:
            - condition: template
              value_template: >-
                {{
                  not is_number(trv_current_raw)
                  or not is_number(trv_target_raw)
                }}
          then:
            - stop: TRV temperature became invalid during update

        - variables:
            trv_temperature: "{{ trv_current_raw | float | round(1) }}"
            trv_target_temperature: "{{ trv_target_raw | float }}"
            temperature_difference: >-
              {{
                (
                  (current_temperature | float)
                  - (trv_current_raw | float | round(1))
                ) | abs
              }}
            minutes_since_last_update: >-
              {% set ts = as_timestamp(states(last_update_helper), default=0) | float(0) %}
              {% if ts <= 0 %}
                999999
              {% else %}
                {{ (as_timestamp(now()) - ts) / 60 }}
              {% endif %}

        # On retries, stop if the latest reading no longer needs synchronising.
        - if:
            - condition: template
              value_template: >-
                {{
                  repeat.index > 1
                  and (temperature_difference | float) < (temperature_change_threshold | float)
                  and (minutes_since_last_update | float) < (force_update_interval | float)
                  and trigger.id != 'home_assistant_start'
                  and is_state(aqara_trv_select_entity, 'external')
                }}
          then:
            - stop: Latest temperature no longer requires an update

        # If the previous attempt converged while we were waiting, record success.
        - if:
            - condition: template
              value_template: >-
                {{
                  repeat.index > 1
                  and is_number(states(aqara_trv_number_entity))
                  and (states(aqara_trv_number_entity) | float | round(1))
                    == (current_temperature | float | round(1))
                  and is_number(state_attr(aqara_trv_climate_entity, 'current_temperature'))
                  and (state_attr(aqara_trv_climate_entity, 'current_temperature') | float | round(1))
                    == (current_temperature | float | round(1))
                }}
          then:
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ last_update_helper }}"
              data:
                timestamp: "{{ now().timestamp() }}"
            - stop: Previous attempt confirmed during retry wait

        - if:
            - condition: template
              value_template: >-
                {{
                  trv_temperature > trv_target_temperature
                  and
                  (current_temperature | float) >
                    (trv_target_temperature + (temperature_target_tolerance | float))
                }}
          then:
            - stop: Heating protection condition became true before update

        # Restore external mode if it changed during the retry wait.
        - if:
            - condition: template
              value_template: "{{ not is_state(aqara_trv_select_entity, 'external') }}"
          then:
            - action: select.select_option
              target:
                entity_id: "{{ aqara_trv_select_entity }}"
              data:
                option: external
            - wait_template: "{{ is_state(aqara_trv_select_entity, 'external') }}"
              timeout:
                seconds: "{{ confirmation_timeout | int }}"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              then:
                - stop: Failed to restore external temperature mode

        # Send the latest validated external temperature.
        - action: number.set_value
          target:
            entity_id: "{{ aqara_trv_number_entity }}"
          data:
            value: "{{ current_temperature | float }}"

        # Confirm both the writable external input and the climate reading.
        # This confirms reported state convergence; it is not a transport-level
        # Zigbee acknowledgement.
        - wait_template: >-
            {{
              is_number(states(aqara_trv_number_entity))
              and
              (states(aqara_trv_number_entity) | float | round(1))
                == (current_temperature | float | round(1))
              and
              is_number(state_attr(aqara_trv_climate_entity, 'current_temperature'))
              and
              (state_attr(aqara_trv_climate_entity, 'current_temperature') | float | round(1))
                == (current_temperature | float | round(1))
            }}
          timeout:
            seconds: "{{ confirmation_timeout | int }}"
          continue_on_timeout: true

        - if:
            - condition: template
              value_template: "{{ wait.completed }}"
          then:
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ last_update_helper }}"
              data:
                timestamp: "{{ now().timestamp() }}"

            - action: system_log.write
              data:
                level: info
                logger: TRV Sync
                message: >
                  Temperature synchronised for {{ aqara_trv_device_name }}.
                  External={{ current_temperature }}°C,
                  previous TRV={{ trv_temperature }}°C,
                  target={{ trv_target_temperature }}°C,
                  difference={{ temperature_difference }}°C,
                  attempt={{ repeat.index }}.
            - stop: TRV temperature update confirmed

        # Log and wait before retrying. The next iteration re-reads all values.
        - if:
            - condition: template
              value_template: "{{ repeat.index <= (max_retries | int) }}"
          then:
            - action: system_log.write
              data:
                level: warning
                logger: TRV Sync
                message: >
                  Temperature update not confirmed for {{ aqara_trv_device_name }}.
                  Requested={{ current_temperature }}°C,
                  attempt={{ repeat.index }} of {{ (max_retries | int) + 1 }}.
                  Retrying in {{ retry_interval }} minutes.
            - delay:
                minutes: "{{ retry_interval | int }}"

  # All attempts exhausted.
  - action: system_log.write
    data:
      level: error
      logger: TRV Sync
      message: >
        Temperature synchronisation failed for {{ aqara_trv_device_name }}
        after {{ (max_retries | int) + 1 }} attempts.
