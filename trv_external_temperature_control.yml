blueprint:
  name: Aqara TRV E1 External Temperature Control
  description: >
    Controls an Aqara Smart Radiator Thermostat E1 using an external
    temperature sensor.

    The external temperature and the TRV external temperature are both
    rounded to one decimal place before comparison. The TRV is updated
    when the difference is 0.1°C or greater.

    A configurable minimum update interval is enforced. If a meaningful
    temperature change occurs during the lockout period, the update is
    deferred and the latest temperature is sent when the interval expires.

    Failed updates are retried at a configurable interval, with a maximum
    number of retry attempts to prevent excessive Zigbee traffic.

    The automation handles external sensor failures, TRV/Zigbee2MQTT
    availability problems, Home Assistant restarts, and periodic
    resynchronisation.

    Requires one input_datetime helper per TRV to record the last
    successfully confirmed update.
  domain: automation
  source_url: "https://github.com/mattabc-lab/blueprint/blob/main/trv_external_temperature_control.yml"

  input:

    external_temp_sensor:
      name: External Temperature Sensor
      description: >
        Temperature sensor used as the external temperature source.
      selector:
        entity:
          filter:
            domain: sensor
            device_class:
              - temperature

    aqara_trv_device:
      name: Aqara TRV Device
      description: >
        Select the Aqara Smart Radiator Thermostat E1.
      selector:
        device:
          multiple: false
          filter:
            - integration: mqtt
              manufacturer: Aqara
              model: Smart radiator thermostat E1 (SRTS-A01)
            - integration: mqtt
              manufacturer: Aqara
              model: Smart radiator thermostat E1
            - integration: mqtt
              manufacturer: Aqara
              model: Aqara Smart Radiator thermostat E1 (SRTS-A01)
            - integration: mqtt
              manufacturer: Aqara
              model: Aqara smart radiator thermostat E1 (SRTS-A01)

    external_temperature_input_name:
      name: TRV's External Temperature Entity Name
      description: >
        Keyword used to identify the TRV number entity which accepts the
        external temperature. Defaults to 'external'.
      selector:
        text:
      default: "external"

    last_update_helper:
      name: Last Successful TRV Update
      description: >
        Select an input_datetime helper configured with both date and time.
        This records the time the TRV successfully confirmed the last
        external temperature update.
      selector:
        entity:
          filter:
            - domain: input_datetime

    minimum_update_interval:
      name: Minimum Update Interval
      description: >
        Minimum time between successful temperature updates.
        Temperature changes during this period are deferred and the
        latest temperature is used.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: minutes
          mode: box

    retry_interval:
      name: Failed Update Retry Interval
      description: >
        Time to wait before retrying an update that was not confirmed
        by the TRV.
      default: 5
      selector:
        number:
          min: 2
          max: 30
          step: 1
          unit_of_measurement: minutes
          mode: box

    max_retries:
      name: Maximum Failed Update Retries
      description: >
        Maximum number of retries after an unsuccessful update.
        This prevents a failed TRV from generating excessive traffic.
      default: 3
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: box

    force_update_interval:
      name: Force Update Interval
      description: >
        Periodically resend the current temperature even when it has
        not changed. Useful for recovering from missed communication
        or device restarts.
      default: 60
      selector:
        number:
          min: 15
          max: 180
          step: 5
          unit_of_measurement: minutes
          mode: box

    confirmation_timeout:
      name: TRV Confirmation Timeout
      description: >
        Maximum time to wait for the TRV entity to reflect the requested
        temperature after a write.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: seconds
          mode: box

mode: single
max_exceeded: silent

variables:
  aqara_trv_device: !input aqara_trv_device
  external_temp_sensor: !input external_temp_sensor
  external_temperature_input_name: !input external_temperature_input_name
  last_update_helper: !input last_update_helper

  minimum_update_interval: !input minimum_update_interval
  retry_interval: !input retry_interval
  max_retries: !input max_retries
  force_update_interval: !input force_update_interval
  confirmation_timeout: !input confirmation_timeout

trigger:

  # External sensor changed.
  - trigger: state
    entity_id: !input external_temp_sensor
    id: temperature_change

  # Periodic recovery / refresh check.
  - trigger: time_pattern
    minutes: "/1"
    id: periodic_check

  # Home Assistant restarted.
  - trigger: homeassistant
    event: start
    id: home_assistant_start


action:

  # ================================================================
  # Locate the TRV entities belonging to the selected device.
  # ================================================================
  - variables:

      aqara_trv_device_name: >-
        {{ device_attr(aqara_trv_device, 'name') }}

      aqara_trv_select_entity: >-
        {% set device_entities = device_entities(aqara_trv_device) %}
        {{ expand(states['select'])
          | selectattr('entity_id', 'in', device_entities)
          | selectattr('attributes.options', 'contains', 'external')
          | map(attribute='entity_id')
          | first
        }}

      aqara_trv_number_entity: >-
        {% set device_entities = device_entities(aqara_trv_device) %}
        {{ expand(states['number'])
          | selectattr('entity_id', 'in', device_entities)
          | selectattr(
              'entity_id',
              'contains',
              external_temperature_input_name
            )
          | map(attribute='entity_id')
          | first
        }}


  # ================================================================
  # External sensor unavailable.
  # ================================================================
  - if:
      - condition: template
        value_template: >-
          {{
            is_state(external_temp_sensor, 'unavailable')
            or is_state(external_temp_sensor, 'unknown')
          }}

    then:

      # Switch the TRV back to its internal sensor.
      - if:
          - condition: template
            value_template: >-
              {{ has_value(aqara_trv_select_entity) }}
        then:
          - action: select.select_option
            target:
              entity_id: "{{ aqara_trv_select_entity }}"
            data:
              option: internal

      - if:
          - condition: trigger
            id: temperature_change
        then:
          - action: system_log.write
            data:
              level: warning
              message: >
                External temperature sensor unavailable for
                {{ aqara_trv_device_name }}.
                TRV switched to internal temperature.
              logger: Aqara TRV

      - stop: External temperature sensor unavailable


  # ================================================================
  # TRV entities unavailable.
  #
  # This can happen during:
  # - Zigbee2MQTT restart
  # - TRV offline
  # - MQTT restart
  # - HA startup
  # ================================================================
  - if:
      - condition: template
        value_template: >-
          {{
            not has_value(aqara_trv_number_entity)
            or not has_value(aqara_trv_select_entity)
          }}

    then:

      # Wait briefly in case Zigbee2MQTT is still starting.
      - wait_template: >-
          {{
            has_value(aqara_trv_number_entity)
            and has_value(aqara_trv_select_entity)
          }}
        timeout:
          seconds: 30
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: >-
              {{
                not has_value(aqara_trv_number_entity)
                or not has_value(aqara_trv_select_entity)
              }}
        then:
          - stop: TRV unavailable


  # ================================================================
  # Current temperature state.
  #
  # Both values are rounded to 1 decimal BEFORE comparison.
  # ================================================================
  - variables:

      current_temperature: >-
        {{ states(external_temp_sensor) | float(0) | round(1) }}

      trv_temperature: >-
        {{ states(aqara_trv_number_entity) | float(0) | round(1) }}

      temperature_difference: >-
        {{
          (
            (states(external_temp_sensor) | float(0) | round(1))
            -
            (states(aqara_trv_number_entity) | float(0) | round(1))
          ) | abs
        }}

      minutes_since_last_update: >-
        {{
          (
            as_timestamp(now())
            -
            as_timestamp(
              states(last_update_helper),
              default=0
            )
          ) / 60
        }}


  # ================================================================
  # Determine whether an update is required.
  # ================================================================
  - variables:

      temperature_update_required: >-
        {{ temperature_difference >= 0.1 }}

      forced_update_required: >-
        {{ minutes_since_last_update >= force_update_interval }}

      startup_update_required: >-
        {{ trigger.id == 'home_assistant_start' }}

      external_mode_required: >-
        {{ not is_state(aqara_trv_select_entity, 'external') }}

      update_required: >-
        {{
          temperature_difference >= 0.1
          or minutes_since_last_update >= force_update_interval
          or trigger.id == 'home_assistant_start'
          or not is_state(aqara_trv_select_entity, 'external')
        }}


  # ================================================================
  # Nothing to do.
  # ================================================================
  - if:
      - condition: template
        value_template: "{{ not update_required }}"
    then:
      - stop: No update required


  # ================================================================
  # Minimum update interval.
  #
  # If we updated recently, WAIT rather than discard the temperature
  # change. After the delay, the current sensor value is read again.
  # ================================================================
  - if:
      - condition: template
        value_template: >-
          {{ minutes_since_last_update < minimum_update_interval }}

    then:

      - delay:
          seconds: >-
            {{
              (
                (
                  minimum_update_interval * 60
                )
                -
                (
                  as_timestamp(now())
                  -
                  as_timestamp(
                    states(last_update_helper),
                    default=0
                  )
                )
              )
              | max(0)
              | round(0)
            }}


  # ================================================================
  # Re-read the latest temperature AFTER the possible delay.
  # ================================================================
  - variables:

      current_temperature: >-
        {{ states(external_temp_sensor) | float(0) | round(1) }}

      trv_temperature: >-
        {{ states(aqara_trv_number_entity) | float(0) | round(1) }}

      temperature_difference: >-
        {{
          (
            (states(external_temp_sensor) | float(0) | round(1))
            -
            (states(aqara_trv_number_entity) | float(0) | round(1))
          ) | abs
        }}

      minutes_since_last_update: >-
        {{
          (
            as_timestamp(now())
            -
            as_timestamp(
              states(last_update_helper),
              default=0
            )
          ) / 60
        }}


  # ================================================================
  # Sensor may have become unavailable during the delay.
  # ================================================================
  - if:
      - condition: template
        value_template: >-
          {{
            not has_value(external_temp_sensor)
          }}
    then:
      - stop: External temperature sensor unavailable


  # ================================================================
  # If temperature no longer requires an update, only continue if
  # this is a startup, forced refresh, or external-mode recovery.
  # ================================================================
  - if:
      - condition: template
        value_template: >-
          {{
            temperature_difference < 0.1
            and minutes_since_last_update < force_update_interval
            and trigger.id != 'home_assistant_start'
            and is_state(aqara_trv_select_entity, 'external')
          }}
    then:
      - stop: Temperature difference no longer requires update


  # ================================================================
  # Make sure the TRV uses the external temperature.
  # ================================================================
  - if:
      - condition: template
        value_template: >-
          {{ not is_state(aqara_trv_select_entity, 'external') }}

    then:

      - action: select.select_option
        target:
          entity_id: "{{ aqara_trv_select_entity }}"
        data:
          option: external

      # Allow the TRV to process the mode change.
      - delay:
          seconds: 10

      # Verify the mode change.
      - if:
          - condition: template
            value_template: >-
              {{ not is_state(aqara_trv_select_entity, 'external') }}
        then:

          - action: system_log.write
            data:
              level: warning
              message: >
                Failed to switch {{ aqara_trv_device_name }}
                to external temperature mode.
              logger: Aqara TRV

          - stop: Failed to select external mode


  # ================================================================
  # SEND / RETRY LOOP
  #
  # Maximum number of attempts:
  #   1 initial attempt + max_retries retries
  #
  # A retry waits retry_interval minutes.
  #
  # This prevents a failed TRV from being hammered indefinitely.
  # ================================================================
  - repeat:
      count: "{{ (max_retries | int) + 1 }}"

      sequence:

        # ------------------------------------------------------------
        # Check that the TRV is still available before every attempt.
        # ------------------------------------------------------------
        - if:
            - condition: template
              value_template: >-
                {{
                  not has_value(aqara_trv_number_entity)
                  or not has_value(aqara_trv_select_entity)
                }}
          then:
            - stop: TRV became unavailable


        # ------------------------------------------------------------
        # Re-read the latest external temperature before EVERY attempt.
        # ------------------------------------------------------------
        - variables:
            current_temperature: >-
              {{ states(external_temp_sensor) | float(0) | round(1) }}


        # ------------------------------------------------------------
        # Send the temperature.
        # ------------------------------------------------------------
        - action: number.set_value
          target:
            entity_id: "{{ aqara_trv_number_entity }}"
          data:
            value: "{{ current_temperature }}"


        # ------------------------------------------------------------
        # Wait for the TRV entity to reflect the requested value.
        # ------------------------------------------------------------
        - wait_template: >-
            {{
              has_value(aqara_trv_number_entity)
              and
              (
                states(aqara_trv_number_entity)
                | float(999)
                | round(1)
              )
              ==
              (
                current_temperature
                | float(999)
                | round(1)
              )
            }}
          timeout:
            seconds: "{{ confirmation_timeout | int }}"
          continue_on_timeout: true


        # ------------------------------------------------------------
        # SUCCESS
        # ------------------------------------------------------------
        - if:
            - condition: template
              value_template: "{{ wait.completed }}"

          then:

            # Record ONLY a confirmed successful update.
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ last_update_helper }}"
              data:
                timestamp: "{{ now().timestamp() }}"

            # Exit the retry loop.
            - stop: TRV temperature update confirmed


        # ------------------------------------------------------------
        # FAILED ATTEMPT
        #
        # If there are retries remaining, wait before trying again.
        # ------------------------------------------------------------
        - if:
            - condition: template
              value_template: >-
                {{ repeat.index <= (max_retries | int) }}

          then:

            - action: system_log.write
              data:
                level: warning
                message: >
                  Aqara TRV {{ aqara_trv_device_name }}
                  did not confirm temperature
                  {{ current_temperature }}°C.
                  Retry {{ repeat.index }} of {{ max_retries }} in
                  {{ retry_interval }} minutes.
              logger: Aqara TRV

            - delay:
                minutes: "{{ retry_interval | int }}"


  # ================================================================
  # All attempts failed.
  #
  # IMPORTANT:
  # We deliberately DO NOT update last_update_helper.
  #
  # The next periodic
